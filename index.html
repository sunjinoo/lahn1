<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12101a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>لحن</title>
<style>
:root{--tint:rgb(139,124,246);--tint-rgb:139,124,246;--bg:#12101a;--text:#f2eefc;--mute:#9d97b5;--line:rgba(255,255,255,.09);--w:255,255,255;--on:#15121f}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",sans-serif;color:var(--text);overflow:hidden;background:radial-gradient(900px 600px at 70% -10%,rgba(var(--tint-rgb),.28),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:minmax(0,1fr) 92px;gap:10px;height:100%;padding:10px}
.panel{background:rgba(var(--w),.045);border:1px solid var(--line);border-radius:18px}
.side{grid-row:1;display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;font-weight:700;font-size:19px}.brand img{width:30px;height:30px;border-radius:9px}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:11px;text-align:start;color:var(--mute);font-size:14px}
.nv:hover{background:rgba(var(--w),.07);color:var(--text)}.nv.on{background:rgba(var(--tint-rgb),.22);color:var(--text)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 4px;font-size:12px;color:var(--mute)}
#pls{display:flex;flex-direction:column;gap:2px}.grow{flex:1;min-height:12px}
main{grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-radius:18px;background:linear-gradient(rgba(var(--tint-rgb),.24),transparent 280px),rgba(var(--w),.03);border:1px solid var(--line)}
.top{display:flex;gap:10px;align-items:center;padding:16px 22px 0}
#q{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--w),.07);color:var(--text);font:inherit;font-size:14px}
.chip{padding:8px 15px;border-radius:999px;font-size:13px;background:rgba(var(--w),.09);transition:background .15s;white-space:nowrap}
.chip:hover{background:rgba(var(--tint-rgb),.35)}.chip.on{background:rgba(var(--tint-rgb),.4)}.chip.pri{background:var(--text);color:var(--on)}
.hero{padding:22px 24px 10px}#vt{font-size:32px;font-weight:750;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{margin-top:4px;font-size:13px;color:var(--mute)}
#list{flex:1;overflow-y:auto;padding:4px 14px 14px}#list::-webkit-scrollbar{width:8px}#list::-webkit-scrollbar-thumb{background:rgba(var(--w),.14);border-radius:8px}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;cursor:pointer;border-inline-start:3px solid transparent}
.row:hover{background:rgba(var(--w),.06)}.row.cur{background:rgba(var(--tint-rgb),.16);border-inline-start-color:var(--tint)}.row.cur b{color:var(--tint)}
.row.off{opacity:.5}.row[hidden]{display:none}.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{display:block;font-size:12px;color:var(--mute);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row i{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;direction:ltr}
.mini{width:32px;height:32px;border-radius:50%;color:var(--mute);font-size:17px;flex:none}.mini:hover{background:rgba(var(--w),.12);color:var(--text)}
.empty{padding:50px 24px;text-align:center;color:var(--mute);line-height:1.9;font-size:14px}
body.drag main{box-shadow:inset 0 0 0 2px var(--tint)}
.bar{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:1fr minmax(320px,1.5fr) 1fr;align-items:center;gap:16px;padding:10px 18px;background:rgba(var(--w),.06);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{width:62px;height:62px;border-radius:12px;overflow:hidden;flex:none;background:rgba(var(--w),.08);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px -8px rgba(var(--tint-rgb),.7)}
.thumb img{width:100%;height:100%;object-fit:cover;display:none}.thumb svg{width:28px;height:28px;opacity:.4}
.info{min-width:0;flex:1;cursor:pointer}
#title{display:block;font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#artist{display:block;font-size:12px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ctl{display:flex;align-items:center;gap:8px;direction:ltr}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);position:relative}.ib:hover{color:var(--text);background:rgba(var(--w),.1)}.ib.on{color:var(--tint)}.ib svg{width:20px;height:20px}
.play{width:46px;height:46px;background:var(--text);color:var(--on)}.play:hover{background:var(--text);color:var(--on);filter:brightness(1.1);transform:scale(1.05)}.play svg{width:24px;height:24px}
#repeat[data-one="1"]::after{content:"1";position:absolute;font-size:9px;font-weight:700;top:17px;left:50%;transform:translateX(-50%)}
.seekrow{display:flex;align-items:center;gap:10px;width:100%;direction:ltr;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:4px;border-radius:4px;cursor:pointer;background:linear-gradient(to right,var(--text) var(--p,0%),rgba(var(--w),.2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
.rt{display:flex;align-items:center;justify-content:flex-end;direction:ltr;gap:4px}.vol{display:flex;align-items:center;gap:8px;width:140px;color:var(--mute)}.vol svg{width:18px;height:18px;flex:none}
#npv{position:fixed;inset:0 0 112px 0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(700px 500px at 50% 30%,rgba(var(--tint-rgb),.45),transparent 70%),var(--bg)}
#npv[hidden]{display:none}#npv img{width:min(340px,40vh);aspect-ratio:1;object-fit:cover;border-radius:22px;background:rgba(var(--w),.08);box-shadow:0 30px 80px -20px rgba(var(--tint-rgb),.8)}
#npv h2{font-size:26px;max-width:min(560px,90vw)}#npv p{color:var(--mute)}#viz{width:min(420px,86vw);height:70px}.cl{position:absolute;top:14px;inset-inline-end:14px}
#menu{position:fixed;z-index:50;min-width:210px;max-height:65vh;overflow:auto;background:color-mix(in srgb,var(--bg) 90%,var(--text));border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#menu[hidden]{display:none}#menu button{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:9px;font-size:14px}#menu button:hover{background:rgba(var(--w),.1)}
#toast{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--on);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}#toast.show{opacity:1}
#eqp{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(0,0,0,.55)}#eqp[hidden]{display:none}
.eqc{background:color-mix(in srgb,var(--bg) 90%,var(--text));border:1px solid var(--line);border-radius:20px;padding:20px;width:min(540px,94vw)}
.eqh{display:flex;gap:8px;align-items:center}.eqh b{flex:1;font-size:16px}
#eqpre{margin-top:14px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--w),.05);color:var(--text);font:inherit;font-size:13px}#eqpre option{background:#1b1827;color:#f2eefc}
.eqs{display:flex;gap:4px;justify-content:space-between;direction:ltr;margin:18px 0 8px}
.eqb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--mute)}.eqb div{height:130px;width:24px;display:grid;place-items:center}
.eqb input{width:120px;margin:0;transform:rotate(-90deg);background:rgba(var(--w),.2)!important}.eqb input::-webkit-slider-thumb{opacity:1}.eqc small{color:var(--mute);font-size:12px}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}.side{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;align-items:center}.brand,.sh,.grow{display:none}.nv{width:auto;white-space:nowrap}#pls{flex-direction:row}main{grid-row:2}.bar{grid-row:3;grid-template-columns:1fr;gap:6px;padding:10px 14px}.rt{display:none}.top{padding:12px 14px 0}.hero{padding:12px 16px 4px}#vt{font-size:24px}#npv{inset:0 0 170px 0}#toast{bottom:180px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#qd{position:fixed;top:10px;bottom:112px;inset-inline-end:10px;width:min(390px,94vw);z-index:45;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 92%,var(--text));border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}#qd[hidden]{display:none}
.qh2{display:flex;align-items:center;gap:8px;padding:14px 16px}.qh2 b{flex:0 1 auto}.qh2 .sub{flex:1;margin:0}
#qs{margin:0 14px 8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--w),.06);color:var(--text);font:inherit;font-size:13px}
#qr{max-height:200px;overflow-y:auto;padding:0 8px;border-bottom:1px solid var(--line)}#qr:empty{display:none}#ql{flex:1;overflow-y:auto;padding:6px 8px 10px}
.qr{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:10px;cursor:pointer;border-inline-start:3px solid transparent}.qr:hover{background:rgba(var(--w),.07)}.qr.cur{background:rgba(var(--tint-rgb),.18);border-inline-start-color:var(--tint)}
.qr .t{flex:1;min-width:0}.qr b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qr span{display:block;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .mini{width:28px;height:28px;font-size:13px}
@media (max-width:860px){#qd{bottom:176px}}

.row.sel{background:rgba(var(--tint-rgb),.3)!important}.row a{cursor:pointer}.row a:hover{text-decoration:underline;color:var(--text)}
#selbar{display:flex;gap:8px;align-items:center;padding:8px 24px;background:rgba(var(--tint-rgb),.22);font-size:14px}#selbar[hidden]{display:none}#selbar>span{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:6px 8px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;text-align:center;background:rgba(var(--w),.05);min-width:0}.card:hover{background:rgba(var(--w),.1)}
.card b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.card span{font-size:12px;color:var(--mute)}
.av{width:84px;height:84px;border-radius:14px;display:grid;place-items:center;font-size:32px;font-weight:700;color:#fff}.av.rd{border-radius:50%}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 8px 10px}.hs .card{flex:none;width:130px}
#list h3{font-size:15px;padding:16px 10px 6px;color:var(--mute);font-weight:600}
.stats{display:flex;gap:10px;padding:6px 8px}.stats div{flex:1;padding:14px;border-radius:14px;background:rgba(var(--w),.06);text-align:center}.stats b{font-size:26px}.stats small{font-size:13px;color:var(--mute)}.stats span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.acts{display:flex;gap:8px;padding:6px 10px}
#slw{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:rgba(0,0,0,.55)}#slw[hidden]{display:none}
.wheelw{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0;direction:ltr}
.wheelw::before{content:"";position:absolute;height:40px;width:170px;border-radius:12px;background:rgba(var(--tint-rgb),.25);pointer-events:none}
#wheel{height:200px;width:110px;overflow-y:auto;scroll-snap-type:y mandatory;padding:80px 0;text-align:center;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
#wheel::-webkit-scrollbar{display:none}#wheel div{height:40px;line-height:40px;font-size:22px;scroll-snap-align:center;color:var(--mute)}#wheel div.sel{color:var(--text);font-weight:700}
.slb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.row .th{width:46px;height:46px;border-radius:9px;flex:none;background:rgba(var(--w),.09) center/cover no-repeat;display:grid;place-items:center;font-size:18px;color:var(--mute)}
.av[data-cv],.av[data-cvk]{background-position:center;background-repeat:no-repeat}

/* --- Lyrics Styles --- */
#lyricModal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
#lyricModal[hidden]{display:none}
.lyric-box{background:color-mix(in srgb,var(--bg) 90%,var(--text));border:1px solid var(--line);border-radius:20px;padding:24px;width:min(600px,94vw);max-height:85vh;display:flex;flex-direction:column;gap:14px;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.lyric-box textarea{width:100%;height:220px;background:rgba(var(--w),.06);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:inherit;resize:vertical}
#lyricDisplayPanel{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(800px 600px at 50% 30%,rgba(var(--tint-rgb),.35),transparent 70%),var(--bg);padding:40px 20px;text-align:center}
#lyricDisplayPanel[hidden]{display:none}
.lyrics-container{flex:1;width:min(700px,90vw);overflow-y:auto;padding:40px 0;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(transparent,#fff 15%,#fff 85%,transparent);mask-image:linear-gradient(transparent,#fff 15%,#fff 85%,transparent)}
.lyrics-container::-webkit-scrollbar{display:none}
.l-line{font-size:20px;font-weight:600;color:var(--mute);padding:12px 0;transition:all .25s ease;cursor:pointer}
.l-line:hover{color:var(--text)}
.l-line.active{color:var(--text);font-size:26px;transform:scale(1.05);text-shadow:0 0 20px rgba(var(--tint-rgb),.8)}
</style>
</head>
<body>
<div class="app">
<nav class="side panel">
  <div class="brand"><img src="icon-192.png" alt=""><span>لحن</span></div>
  <button class="nv" data-v="queue">☰ <span>قايمة التشغيل</span></button>
  <button class="nv" data-v="home">⌂ <span>الرئيسية</span></button>
  <button class="nv" data-v="lib">♫ <span>أغانيك</span></button>
  <button class="nv" data-v="artists">👤 <span>الفنانون</span></button>
  <button class="nv" data-v="albums">💿 <span>الألبومات</span></button>
  <button class="nv" data-v="fav">♥ <span>المفضلة</span></button>
  <button class="nv" data-v="hist">🕘 <span>السجل</span></button>
  <div class="sh"><span>قوائمي</span><button class="mini" id="np" aria-label="قايمة جديدة">＋</button></div>
  <div id="pls"></div><div class="grow"></div>
  <div class="sh"><span id="today"></span></div>
  <button class="nv" id="spd">السرعة 1×</button>
  <button class="nv" id="slp">مؤقت النوم: إيقاف</button>
  <button class="nv" id="eqb">🎚 المعادل</button>
  <button class="nv" id="skn">🎨 الشكل</button>
  <button class="nv" id="lang">🌐 اللغة</button>
</nav>
<main>
  <div class="top"><input id="q" type="search" placeholder="ابحث في القايمة…" aria-label="ابحث في القايمة…"><button class="chip pri" id="addf">ملفات</button><button class="chip" id="addd">مجلد</button><button class="chip" id="vm" aria-label="المزيد">⋯</button></div>
  <div class="hero"><h1 id="vt"></h1><div class="sub"><span id="count"></span> <span>أغنية</span></div></div>
  <select id="view" hidden></select>
  <div id="list"></div>
</main>
<footer class="bar">
  <div class="np"><div class="thumb" id="thumb"><img id="art" alt=""><svg id="ph" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></div><div class="info"><span id="title">مفيش حاجة شغالة</span><span id="artist">ضيف موسيقى من القايمة</span></div><button class="mini" id="fv" aria-label="مفضلة">♡</button></div>
  <div class="mid">
    <div class="ctl">
      <button class="ib" id="shuffle" aria-label="عشوائي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="ib" id="prev" aria-label="السابق"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
      <button class="ib play" id="play" aria-label="تشغيل"><svg viewBox="0 0 24 24" fill="currentColor"><path id="pp" d="M8 5v14l11-7z"/></svg></button>
      <button class="ib" id="next" aria-label="التالي"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
      <button class="ib" id="repeat" aria-label="تكرار"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>
    <div class="seekrow"><span id="tc">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="موضع التشغيل"><span id="td">0:00</span></div>
  </div>
  <div class="rt">
    <button class="ib" id="lyricBtn" aria-label="الكلمات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <div class="vol"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input type="range" id="vol" min="0" max="100" aria-label="مستوى الصوت"></div>
  </div>
</footer>
</div>

<!-- شاشة عرض الكلمات التفاعلية -->
<div id="lyricDisplayPanel" hidden>
  <button class="mini cl" id="lyricClose" aria-label="إغلاق">✕</button>
  <div style="margin-bottom:10px">
    <h3 id="lyricTitle" style="font-size:22px;font-weight:700"></h3>
    <span id="lyricArtist" style="font-size:14px;color:var(--mute)"></span>
  </div>
  <div class="lyrics-container" id="lyricsScroll"></div>
  <div style="margin-top:10px;display:flex;gap:8px">
    <button class="chip" id="lyricModeBtn">طريقة العرض: متزامن</button>
    <button class="chip pri" id="lyricEditBtn">تعديل الكلمات</button>
  </div>
</div>

<!-- نافذة إضافة / تعديل الكلمات -->
<div id="lyricModal" hidden>
  <div class="lyric-box">
    <div class="eqh"><b>إضافة / تعديل الكلمات</b><button class="chip" id="lyricModalClose" aria-label="إغلاق">✕</button></div>
    <p style="font-size:12px;color:var(--mute)">اكتب الكلمات العادية، أو استخدم صيغة التوقيت (LRC) للكلمات المتزامنة مثل:<br><code>[00:12.50] السطر الأول هنا</code></p>
    <textarea id="lyricInput" placeholder="الصق أو اكتب الكلمات هنا..."></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="chip" id="lyricCancel">إلغاء</button>
      <button class="chip pri" id="lyricSave">حفظ</button>
    </div>

function parseLyrics(raw) {
  if (!raw) return { type: 'plain', lines: [] };
  const lines = [];
  const isLrc = /\[\d{2}:\d{2}/.test(raw);
  if (!isLrc) {
    return { type: 'plain', text: raw, lines: raw.split('\n').map(t => ({ time: -1, text: t })) };
  }
  const regex = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)/;
  raw.split('\n').forEach(line => {
    const match = line.match(regex);
    if (match) {
      const min = parseInt(match[1], 10);
      const sec = parseInt(match[2], 10);
      const ms = match[3] ? parseInt(match[3].padEnd(3, '0').slice(0,3), 10) : 0;
      const time = min * 60 + sec + ms / 1000;
      const text = match[4].trim();
      lines.push({ time, text });
    } else if (line.trim()) {
      lines.push({ time: -1, text: line.trim() });
    }
  });
  return { type: 'synced', lines: lines.sort((a,b) => a.time - b.time) };
}

  const container = $('#lyricsScroll');
  
  if (!raw.trim()) {
    container.innerHTML = `<div class="empty">مفيش كلمات متضافة للأغنية دي.<br>اضغط «تعديل الكلمات» لإضافتها بصيغة عادية أو متزامنة.</div>`;
    return;
  }
  if (lyricMode === 'plain' || parsed.type === 'plain') {
    container.innerHTML = `<div style="white-space:pre-wrap;font-size:18px;line-height:2.2;color:var(--text);text-align:center">${esc(parsed.text || raw)}</div>`;
  } else {
    container.innerHTML = parsed.lines.map((l, i) => `<div class="l-line" data-i="${i}" data-time="${l.time}" dir="auto">${esc(l.text)}</div>`).join('');
  }
}

$('#lyricBtn').onclick = () => {
  const k = curKey();
  if (!k) return toast('مفيش أغنية شغالة حالياً');
  $('#lyricDisplayPanel').hidden = false;
  renderLyricsView();
};
$('#lyricClose').onclick = () => { $('#lyricDisplayPanel').hidden = true; };
$('#lyricEditBtn').onclick = () => { openLyricModal(curKey()); };
$('#lyricModeBtn').onclick = (e) => {
  lyricMode = lyricMode === 'synced' ? 'plain' : 'synced';
  e.currentTarget.textContent = 'طريقة العرض: ' + (lyricMode === 'synced' ? 'متزامن' : 'عادي');
  renderLyricsView();
};

audio.addEventListener('timeupdate', () => {
  $('#tc').textContent = fmt(audio.currentTime);
  if (!seeking && audio.duration) { $('#seek').value = audio.currentTime / audio.duration * 1000; fill($('#seek')); }
  
  const k = curKey();
  if (!k || $('#lyricDisplayPanel').hidden || lyricMode === 'plain') return;
  const raw = DB.lyrics[k];
  if (!raw || !/\[\d{2}:\d{2}/.test(raw)) return;
  const parsed = parseLyrics(raw);
  const ct = audio.currentTime;
  let activeIdx = -1;
  for (let i = 0; i < parsed.lines.length; i++) {
    if (parsed.lines[i].time <= ct) activeIdx = i;
    else break;
  }
  const lines = document.querySelectorAll('.l-line');
  lines.forEach((el, i) => {
    const isActive = i === activeIdx;
    el.classList.toggle('active', isActive);
    if (isActive && !el.dataset.scrolled) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.dataset.scrolled = '1';
    } else if (!isActive) {
      delete el.dataset.scrolled;
    }
  });
});

$('#list').addEventListener('click', (e) => {
  const r = e.target.closest('.row'); if (!r) return;
  const k = r.dataset.k, b = e.target.closest('.mini');
  if (!b) return playFrom(k);
  if (b.dataset.act === 'fav') return toggleFav(k);
  const p = b.getBoundingClientRect();
  showMenu(p.left, p.bottom + 4, [
    ['⏭ تشغيل بعد دي', () => enqueue(k, true)],
    ['⏬ إضافة لقايمة التشغيل', () => enqueue(k, false)],
    ['➕ إضافة لقايمة…', (x, y) => addMenu(k, x, y)],
    ['📝 إضافة / تعديل الكلمات', () => openLyricModal(k)],
    [isFav(k) ? '♡ شيل من المفضلة' : '♥ أضف للمفضلة', () => toggleFav(k)],
    ['↗ مشاركة الأغنية', () => shareTrack(k)],
    ['✕ إزالة من هنا', () => removeKey(k)],
  ]);
});
$('#view').onchange = (e) => { view = e.target.value; render(); };
$('#fv').onclick = () => toggleFav(curKey());

/* ---- الثيمات والمعادل ونظام اللغات ---- */
const SKINS = {
  nagham: ['لحن', '#12101a', '#f2eefc', '#9d97b5', '255,255,255', '#15121f', null],
  midnight: ['منتصف الليل', '#000000', '#f2eefc', '#9d97b5', '255,255,255', '#15121f', null],
  sunset: ['غروب', '#1a0e0b', '#fff1ea', '#c9a79a', '255,255,255', '#1a0e0b', '255,138,76'],
  neon: ['نيون', '#06060f', '#eafcff', '#7fa3b3', '255,255,255', '#06060f', '0,229,255'],
  forest: ['غابة', '#0b1510', '#e9f7ee', '#8fb09b', '255,255,255', '#0b1510', '74,222,128'],
  rose: ['وردي', '#1a0d16', '#ffeef7', '#c79ab4', '255,255,255', '#1a0d16', '255,107,181'],
  paper: ['ورقي (فاتح)', '#f3efe6', '#1c1830', '#6b6680', '0,0,0', '#f3efe6', '109,74,255'],
};
function applySkin(id) {
  const s = SKINS[id] || SKINS.nagham, st = document.documentElement.style;
  ['--bg', '--text', '--mute', '--w', '--on'].forEach((p, i) => st.setProperty(p, s[i + 1]));
  st.setProperty('--line', `rgba(${s[4]},.09)`);
  window.__fix = !!s[6];
  if (s[6]) { st.setProperty('--tint', `rgb(${s[6]})`); st.setProperty('--tint-rgb', s[6]); }
  else tintFrom($('#art').style.display === 'block' ? $('#art').src : null);
  document.querySelector('meta[name=theme-color]').content = s[1];
  try { localStorage.ng_skin = id; } catch (_) {}
}
$('#skn').onclick = (e) => {
  const p = e.currentTarget.getBoundingClientRect(), cur_ = localStorage.ng_skin || 'nagham';
  showMenu(p.left, p.top - 300, Object.entries(SKINS).map(([id, s]) => [(id === cur_ ? '● ' : '○ ') + s[0], () => applySkin(id)]));
};
applySkin(localStorage.ng_skin || 'nagham');
render();

/* ---- تشغيل الملفات والمكتبة والصوتيات ---- */
const idb = new Promise((res, rej) => { const r = indexedDB.open('nagham', 1); r.onupgradeneeded = () => ['blobs', 'h'].forEach((n) => r.result.createObjectStore(n)); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const tx = (s, m, f) => idb.then((db) => new Promise((res, rej) => { const t = db.transaction(s, m), q = f(t.objectStore(s)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
const idbPut = (s, k, v) => tx(s, 'readwrite', (o) => o.put(v, k));
const idbGet = (s, k) => tx(s, 'readonly', (o) => o.get(k));
const idbAll = async (s) => { const ks = await tx(s, 'readonly', (o) => o.getAllKeys()), vs = await tx(s, 'readonly', (o) => o.getAll()); return ks.map((k, i) => [k, vs[i]]); };
let DIR = null, scanning = false, restored = false, fd = false;
document.querySelector('.hero').insertAdjacentHTML('afterend', '<div style="padding:0 24px"><button class="chip pri" id="perm" hidden>اسمح بالوصول لمكتبتك</button></div>');
async function* walk(dh, path = '') { for await (const [name, h] of dh.entries()) { if (h.kind === 'directory') yield* walk(h, path + name + '/'); else if (AUD.test(name)) yield [h, path + name]; } }
async function scanDir(dh, quiet) {
  if (scanning) return; scanning = true; window.__scan = true; if (!quiet) toast('اتربط الفولدر — بيتم فحص الأغاني…');
  let n = 0;
  try {
    for await (const [fh] of walk(dh)) {
      const f = await fh.getFile(), k = f.name + '|' + f.size, old = DB.lib[k]; files.set(k, f);
      if (!old || old.mt !== f.lastModified) { const tg = await readTags(k); DB.lib[k] = { title: tg.title || f.name.replace(/\.[^.]+$/, ''), artist: tg.artist, album: tg.album, year: tg.year || '', genre: tg.genre || '', duration: old ? old.duration : 0, mt: f.lastModified, src: 'dir', added: old ? old.added : Date.now() }; }
      if (++n % 200 === 0) render();
    }
  } catch (e) { console.warn(e); }
  window.__scan = false; scanning = false; persist(); render(); restoreQueue();
}
async function importKeys(ks) {
  for (const k of ks) {
    const f = files.get(k), tg = await readTags(k); await idbPut('blobs', k, f);
    DB.lib[k] = { title: tg.title || f.name.replace(/\.[^.]+$/, ''), artist: tg.artist, album: tg.album, year: tg.year || '', genre: tg.genre || '', duration: (DB.lib[k] || {}).duration || 0, mt: f.lastModified, src: 'blob', added: (DB.lib[k] || {}).added || Date.now() };
  }
  persist(); view = 'lib'; render(); toast('اتحفظت الأغاني داخل التطبيق');
}
async function connectFolder() {
  if (window.showDirectoryPicker) { try { DIR = await showDirectoryPicker({ id: 'nagham-music', mode: 'read' }); await idbPut('h', 'music', DIR); view = 'lib'; scanDir(DIR); } catch (_) {} }
  else { const ks = await api.pick('folder'); if (ks.length) importKeys(ks); }
}
async function restoreQueue() {
  if (restored) return;
  const ks = JSON.parse(localStorage.q || '[]').filter((k) => files.has(k)); if (!ks.length) return; restored = true;
  const last = JSON.parse(localStorage.ng_pos || 'null');
  if (last && last.p) audio.addEventListener('loadedmetadata', () => { audio.currentTime = last.p; }, { once: true });
  tracks = await Promise.all(ks.map(metaOf));
  await setTrack(Math.max(0, tracks.findIndex((t) => last && t.path === last.k)), false);
}
$('#addf').onclick = async () => { const ks = await api.pick('files'); if (ks.length) { add(ks); importKeys(ks); } };
$('#addd').onclick = connectFolder;
$('#perm').onclick = async () => { if (DIR && (await DIR.requestPermission({ mode: 'read' })) === 'granted') { $('#perm').hidden = true; scanDir(DIR); } };

(async () => {
  try {
    (await idbAll('blobs')).forEach(([k, f]) => files.set(k, f));
    if (Object.keys(DB.lib).length) { view = 'home'; render(); }
    const h = await idbGet('h', 'music');
    if (h) { DIR = h; if ((await h.queryPermission({ mode: 'read' })) === 'granted') await scanDir(h, true); else $('#perm').hidden = false; }
    restoreQueue();
  } catch (e) { console.warn(e); }
})();
</script>
